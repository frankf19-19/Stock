name: FinMind 分點能力探測
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: timeout 900 python fm_probe.py || true
      - run: |
          git config user.name "kyansuo-bot"; git config user.email "bot@kyansuo"
          git add fm_probe.json && git commit -m "probe: FinMind 分點能力" -q || exit 0
          for i in 1 2 3; do git pull --rebase --autostash -X theirs origin main -q && git push -q && exit 0; sleep 10; done
