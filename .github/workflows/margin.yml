name: 散戶槓桿(融資券/借券/當沖)
on:
  push:
    branches: [main]
    paths: [build_margin_pressure.py, fetch_margin.py, .github/workflows/margin.yml]
  workflow_dispatch: {}
  schedule:
    - cron: '40 13 * * 1-5'      # 台北 21:40(當沖統計約 21:00 後才齊,一次抓齊三表)
permissions:
  contents: write
concurrency:
  group: margin-pressure
  cancel-in-progress: false
jobs:
  margin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Fetch margin data
        run: python fetch_margin.py
      - name: Build stock balance changes and hypothetical stress prices
        run: python build_margin_pressure.py
      - name: Commit
        run: |
          git config user.name margin-bot
          git config user.email margin@local
          git add margin.json margin_diag.json margin_pressure.json.gz margin_pressure.csv archive/hist/margin archive/stock_research/margin_pressure
          git diff --cached --quiet || git commit -m "margin $(date +%F) [CI Skip]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*7))
          done
          exit 1
