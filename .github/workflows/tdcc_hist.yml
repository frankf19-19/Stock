name: 集保股權分散多年歷史(一次性回補)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tdcc-hist
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 回補
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TDCC_BUDGET_SEC: "6300"
        run: python fetch_tdcc_hist.py
      - name: 提交
        if: always()
        run: |
          git config user.name "kyansuo-bot"; git config user.email "bot@users.noreply.github.com"
          git add archive/tdcc_hist.json.gz; git commit -qm "archive: 集保股權分散歷史 $(date +'%m-%d %H:%M')" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && exit 0; sleep 10; done
