name: 探針:證交所 openapi 收盤檔(暫時)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: |
          python - <<'PY'
          import requests, json
          for tag, url in [("上市", "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL"), ("上櫃", "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes")]:
              try:
                  arr = requests.get(url, headers={"User-Agent": "Mozilla/5.0", "accept": "application/json"}, timeout=50).json()
                  print(f"::notice::{tag} {len(arr)} 筆 keys={list(arr[0].keys())}")
                  want = {"2368", "1301", "1303", "2330", "3044", "2851", "3443", "6488"}
                  for r in arr:
                      c = str(r.get("Code") or r.get("SecuritiesCompanyCode") or "").strip()
                      if c in want: print("::notice::" + tag + " " + json.dumps(r, ensure_ascii=False))
              except Exception as e:
                  print(f"::warning::{tag} 失敗 {e}")
          PY
