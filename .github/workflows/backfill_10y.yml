name: 長期歷史回補(15 年,r910)
on:
  workflow_dispatch:
  schedule:
    - cron: '20 */3 * * *'          # 每 3 小時檢查一次;只有「台股休市日」(週末+國定假日)才真的跑(r911)
permissions:
  contents: write
concurrency:
  group: archive-backfill
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: 今天是交易日嗎?(交易日不跑,把資源留給日常更新)
        id: gate
        run: |
          if python market_day.py tw && [ "${{ github.event_name }}" = "schedule" ]; then echo "run=0" >> $GITHUB_OUTPUT; else echo "run=1" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == '1'
        with:
          python-version: '3.11'
      - run: pip install requests numpy
        if: steps.gate.outputs.run == '1'
      - name: 回補(每輪最多 4500 次 API、300 分鐘)
        if: steps.gate.outputs.run == '1'
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          BF_BUDGET: '4500'
          BF_MINUTES: '300'
        run: python backfill_10y.py
      - name: 🧠 大腦長期研究(用 15 年資料重跑各種訊號)
        if: steps.gate.outputs.run == '1'
        run: python brain_study.py || echo "長期研究失敗"
      - name: 🧠 AI Pick v2 模型每月重訓(距上次 ≥ 25 天才跑)
        if: steps.gate.outputs.run == '1'
        run: timeout 2400 python retrain_v2.py || echo "重訓失敗,保留舊模型"
      - name: 提交存檔
        if: steps.gate.outputs.run == '1'
        run: |
          git config user.name "kyansuo-bot"; git config user.email "bot@users.noreply.github.com"
          git add archive/ brain_study.json aipick_v2_model.json brain_v2_log.json 2>/dev/null || git add archive/
          git commit -m "archive: 長期歷史回補 $(date +'%m-%d %H:%M')" -q || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs origin main -q && git push -q && exit 0; sleep 8; done
