name: 每日資料更新(三力儀表板)

on:
  schedule:
    # r740 班次分工——實測 #555 各步耗時:update_data.py 22m59s、ETF 32s、報價 35s、aipick 0s。
    # 舊排程「盤中每10分一班」配 23 分鐘的重活,結構上就注定互相踩:歷史累積 74 次 Scheduled 被 Cancelled,
    # 還有一筆 #406 從 8/19 卡在 Queued 12 天(cancel-in-progress: false 沒有自癒能力)。
    # 新分工:盤中的輕活(報價/spark/AI Pick 結算)全部交給 intraday-quotes 的自迴圈,這裡只留重活、降到低頻。
    #
    # r781 傍晚改自迴圈——9/3 稽核:cron 設 15:37 起每小時共 8 班,GitHub 實際只跑了 16:13、20:03 兩班,而且各晚 1~2 小時。
    #      GitHub 對忙碌時段的排程會延遲、甚至整班丟掉,班距再密都沒用。解法跟盤中 r741 一樣:一天只要點著一次,
    #      自己迴圈到收工。傍晚分兩段(單一 job 上限 6 小時):A 段 14:50 點火跑到 19:00,B 段 19:05 點火跑到 23:00,
    #      各在每小時 :37 跑一輪(17:37 接 ETF 申報、21:37 接 TWSE 融資券)。各段另備一個晚 40 分鐘的備援觸發:
    #      主觸發若被丟掉,備援接手;主觸發活著,備援會排隊到主段結束後啟動、發現已過 END 立刻收工,不重複做事。
    - cron: '17 0 * * 1-6'                   # 台北 08:17|開盤前一班(補前一日缺的 K;週一到週六都跑,原本 2-6 讓週一早上沒班)
    - cron: '30 3 * * 1-5'                   # 台北 11:30|月營收上午公告即時入站
    - cron: '50 6 * * 1-5'                   # 台北 14:50|傍晚 A 段點火 → 自迴圈到 19:00(15:37/16:37/17:37/18:37)
    - cron: '30 7 * * 1-5'                   # 台北 15:30|A 段備援
    - cron: '5 11 * * 1-5'                   # 台北 19:05|傍晚 B 段點火 → 自迴圈到 23:00(19:37/20:37/21:37/22:37)
    - cron: '45 11 * * 1-5'                  # 台北 19:45|B 段備援
    - cron: '30 10 * * 6,0'                  # 週末 18:30|月營收假日公告補抓
  workflow_dispatch:           # r798:手動/Worker 點火也照時段自迴圈;要單次就把 loop 設 no
    inputs:
      loop:
        description: '自迴圈?auto=依現在時段(14:45~19:00 A 段、19:00~23:00 B 段)/ no=只跑一輪'
        required: false
        default: 'auto'

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false    # r781:迴圈班不能被備援觸發砍掉;卡死靠 END 絕對時間 + timeout-minutes 自癒(排隊班一啟動就會發現過期收工)

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 265                       # r781:一段最長 14:50→19:00 ≈ 4h10m,留餘裕;單次班遠小於此
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install requests pandas lxml html5lib beautifulsoup4 pypdf pywebpush   # r784:Web Push

      - name: 還原分點原始資料快取(bkraw,250 日,不進 repo)
        uses: actions/cache/restore@v4
        with:
          path: bkraw
          key: bkraw-${{ github.run_id }}
          restore-keys: |
            bkraw-
      - name: 每日更新(單次或傍晚自迴圈)
        env:
          PYTHONUNBUFFERED: "1"                          # log 即時輸出,不再看起來像卡住
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}      # 美股指數官方源(fetch_macro)
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}    # 可選;未設定則走免token額度
          US_YAHOO_FALLBACK: "1"                         # r705:美股日K最後備援(僅美股;設 0 可關,台股維持零 Yahoo)
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}          # r771:入選/出場理由(純敘述,沒金鑰就跳過)
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SB_SERVICE_KEY: ${{ secrets.SB_SERVICE_KEY }}   # r776:讀最愛名單/持股成本(三級訊號);只放這裡,不進前端
          SB_UID: ${{ secrets.SB_UID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}   # r784:Web Push 私鑰(公鑰在 app.js)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}       # r788:Actions 內建,Worker 用它驗證後端(不用另設)
          FIRED_CRON: ${{ github.event.schedule }}       # 哪一條 cron 點的火(手動觸發為空)
          LOOP: ${{ github.event.inputs.loop || 'auto' }} # r798
        run: |
          set +e
          git config user.name  "bot"
          git config user.email "actions@users.noreply.github.com"

          # ── 哪一段?r798:改看「現在幾點」,不看哪條 cron 點的火——
          #    9/8 稽核:15:30 的 A 段備援被 GitHub 延到 20:14 才啟動,照 cron 字串判成 A 段、收工 19:00 已過,跑一輪就走;
          #    Worker 準時 dispatch 的班沒有 cron 字串,判成單次班也各跑一輪就走。整晚沒有任何一班在迴圈,21:37 融資券那輪從沒跑。
          #    現在:平日 14:45~19:00 啟動 → A 段(收工 19:00);19:00~23:00 啟動 → B 段(收工 23:00);其餘單次。loop=no 強制單次。
          END=0
          HHMM=$((10#$(TZ=Asia/Taipei date +%H%M))); DOW=$(TZ=Asia/Taipei date +%u)
          if [ "$LOOP" != "no" ] && [ "$DOW" -le 5 ]; then
            if   [ $HHMM -ge 1445 ] && [ $HHMM -lt 1900 ]; then END=$(TZ=Asia/Taipei date -d "today 19:00" +%s 2>/dev/null || echo 0)
            elif [ $HHMM -ge 1900 ] && [ $HHMM -lt 2300 ]; then END=$(TZ=Asia/Taipei date -d "today 23:00" +%s 2>/dev/null || echo 0)
            fi
          fi
          echo "啟動 $(TZ=Asia/Taipei date '+%m/%d %H:%M')(cron='$FIRED_CRON' loop=$LOOP)"
          if [ "$END" != "0" ]; then echo "傍晚自迴圈:每小時 :37 跑一輪,預計 $(TZ=Asia/Taipei date -d @$END '+%H:%M') 收工"; else echo "單次班"; fi

          # r821:每一步計時 + 落地 run_log.json;重活跑完就先提交一次(存檔點),之後就算被砍掉分點/歷史也不會白跑
          step() { local n="$1"; shift; local t0=$(date +%s); "$@"; local rc=$?; local sec=$(( $(date +%s) - t0 ))
            echo "{\"n\":\"$n\",\"t\":\"$(TZ=Asia/Taipei date '+%m-%d %H:%M')\",\"sec\":$sec,\"rc\":$rc}" >> run_steps.jsonl
            [ $rc -ne 0 ] && echo "  ⚠ $n 結束碼 $rc(${sec}s)"; return $rc; }
          fold_log() { python - <<'PY'
          import json,os
          L=[]
          try: L=json.load(open('run_log.json',encoding='utf-8')).get('rounds',[])
          except Exception: L=[]
          steps=[]
          if os.path.exists('run_steps.jsonl'):
              for ln in open('run_steps.jsonl',encoding='utf-8'):
                  try: steps.append(json.loads(ln))
                  except Exception: pass
              os.remove('run_steps.jsonl')
          if steps:
              L.append({"start":steps[0]["t"],"end":steps[-1]["t"],"sec":sum(x["sec"] for x in steps),"steps":steps,"run":os.environ.get("GITHUB_RUN_NUMBER")})
          json.dump({"rounds":L[-60:]},open('run_log.json','w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          PY
          }
          commit_push() {
            fold_log
            git add -A data.json k c
            [ -f tdcc.json ] && git add tdcc.json
            [ -f etf_hold.json ] && git add etf_hold.json
            [ -f etf_rev.json ] && git add etf_rev.json
            git add e/ 2>/dev/null || true
            [ -f spark.json ] && git add spark.json
            [ -f aipick.json ] && git add aipick.json
            [ -f notify_state.json ] && git add notify_state.json
            [ -f hourly_scan.json ] && git add hourly_scan.json
            [ -f bias.json ] && git add bias.json
            git add sbl/ 2>/dev/null || true
            for f in taifex.json signal_log.json signal_stats.json gov.json run_log.json kb_today.json broker_tags.json; do [ -f $f ] && git add $f; done
            git add bk/ hist/ 2>/dev/null || true
            if git diff --cached --quiet; then echo "沒有變更,略過提交"; return 0; fi
            git commit -m "data: $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')${1:+ ($1)}"
            for i in 1 2 3; do
              git pull --rebase --autostash -X theirs origin main && git push && return 0
              echo "推送撞車,10 秒後重試($i/3)…"; git rebase --abort 2>/dev/null || true; sleep 10
            done
            echo "::warning::推送重試 3 次仍失敗,本輪成果留在工作樹,下一輪一起再推"; return 1
          }

          run_once() {
            echo "══════ 開始一輪 $(TZ=Asia/Taipei date '+%m/%d %H:%M') ══════"
            git pull --rebase --autostash -X theirs origin main || true     # 先同步別班的成果(ETF 17:35、盤中迴圈)
            # r823:輕量輪——每段第 2 輪起 ETF 持股不重抓、update_data.py 略過逐檔磨補/個股新聞/總經新聞/法說會(沿用上一輪)
            if [ "${HEAVY_EXTRAS:-1}" = "1" ]; then
              step 主資料 bash -c 'python fetch_etf.py || echo "ETF 持股抓取失敗,主程式沿用舊 etf_hold.json"; python update_data.py || echo "::warning::update_data.py 失敗,本輪略過主資料"'
            else
              step 主資料輕量 bash -c 'UD_FULL=0 python update_data.py || echo "::warning::update_data.py 失敗,本輪略過主資料"'
            fi
            step 報價快照 timeout 300 python update_quotes.py || echo "報價快照失敗,不影響主資料"
            step 大盤週乖離 timeout 300 python fetch_bias.py || echo "大盤週乖離失敗,不影響主資料"        # r789
            step 借券 timeout 600 python backfill_sbl.py || echo "借券回補失敗,不影響主資料"          # r793
            step 期交所 timeout 300 python fetch_taifex.py || echo "期交所籌碼失敗,不影響主資料"        # r795
            step 訊號成績單 timeout 300 python score_signals.py || echo "訊號成績單失敗,不影響主資料"        # r795
            commit_push 存檔點1 || true                                                    # r821:主資料先落地
            # r820:分點/歷史回補一天只需一次,只在「單次班」或「B 段第一輪」跑;其他輪 30 分鐘內結束,19:37/20:37/21:37 才不會擠成一團
            if [ "${HEAVY_EXTRAS:-1}" = "1" ] && [ $HHMM -ge 1700 -o "$END" = "0" ]; then
              step 分點 timeout 2400 python fetch_broker.py || echo "分點失敗,不影響主資料"            # r802:FinMind Sponsor;r820:雙線程
              commit_push 存檔點2 || true                                                 # r821:分點先落地
              step 歷史回補 timeout 1500 python backfill_hist.py || echo "歷史回補失敗,不影響主資料"       # r802;r803:每 150 次落地
              step 分點歷史 timeout 1650 python backfill_broker.py || echo "分點歷史失敗,不影響主資料"      # r804/r811:一天一次全市場
              commit_push 存檔點3 || true
            else
              echo "  (本輪略過分點/歷史回補:HEAVY_EXTRAS=${HEAVY_EXTRAS:-1}, HHMM=$HHMM)"
            fi
            step AIPick timeout 900 python aipick.py || echo "AI Pick 失敗,不影響主資料"
            step 推播 timeout 300 python notify.py || echo "推播失敗,不影響主資料"
            commit_push                                                                    # 整輪提交
          }

          if [ "$END" = "0" ]; then
            run_once; exit 0
          fi

          # ── 傍晚自迴圈:第一輪立刻跑,之後每到 :37 跑一輪,過 END 收工 ──
          run_once
          export HEAVY_EXTRAS=0                       # r820:第二輪起不再跑分點/歷史回補
          while : ; do
            NOW=$(date +%s)
            [ $NOW -ge $END ] && { echo "已到 $(TZ=Asia/Taipei date -d @$END '+%H:%M'),本段收工"; break; }
            # 下一個 :37(台北)
            H=$(TZ=Asia/Taipei date +%H); M=$((10#$(TZ=Asia/Taipei date +%M)))
            if [ $M -lt 37 ]; then NEXT=$(TZ=Asia/Taipei date -d "today $H:37" +%s); else NEXT=$(TZ=Asia/Taipei date -d "today $H:37 1 hour" +%s); fi
            [ $NEXT -ge $END ] && { echo "下一輪 $(TZ=Asia/Taipei date -d @$NEXT '+%H:%M') 已過收工時間,本段結束"; break; }
            WAIT=$((NEXT-NOW)); [ $WAIT -lt 0 ] && WAIT=0
            echo "下一輪 $(TZ=Asia/Taipei date -d @$NEXT '+%H:%M'),等 $((WAIT/60)) 分鐘"
            sleep $WAIT
            run_once
          done
      - name: 保存分點原始資料快取
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bkraw
          key: bkraw-${{ github.run_id }}
