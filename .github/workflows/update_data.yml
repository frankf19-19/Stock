name: 每日資料更新(三力儀表板)

on:
  schedule:
    # r740 班次分工——實測 #555 各步耗時:update_data.py 22m59s、ETF 32s、報價 35s、aipick 0s。
    # 舊排程「盤中每10分一班」配 23 分鐘的重活,結構上就注定互相踩:歷史累積 74 次 Scheduled 被 Cancelled,
    # 還有一筆 #406 從 8/19 卡在 Queued 12 天(cancel-in-progress: false 沒有自癒能力)。
    # 新分工:盤中的輕活(報價/spark/AI Pick 結算)全部交給 intraday-quotes 的自迴圈,這裡只留重活、降到低頻。
    - cron: '17 0 * * 1-6'                   # 台北 08:17|開盤前一班(補前一日缺的 K;週一到週六都跑,原本 2-6 讓週一早上沒班)
    - cron: '30 3 * * 1-5'                   # 台北 11:30|月營收上午公告即時入站
    - cron: '7 7-14 * * 1-5'                 # 台北 15:07 起每小時|收盤K/期貨/法人/融資券/借券/ETF持股(單班 23~44 分,班距一小時才不會互砍)
    - cron: '30 10 * * 6,0'                  # 週末 18:30|月營收假日公告補抓
  workflow_dispatch:           # 也可以到 Actions 頁面手動觸發

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: true     # r740:卡死自癒——新班直接接手,不再像 #406 那樣卡在 Queued 十幾天堵住整組

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install requests pandas lxml html5lib beautifulsoup4 pypdf

      - name: 抓 ETF 持股(主動式,先跑好給主程式讀)
        run: python fetch_etf.py || echo "ETF 持股抓取失敗,主程式沿用舊 etf_hold.json"

      - name: 執行每日更新(價格/法人/大戶/營收/評分/法說)
        env:
          PYTHONUNBUFFERED: "1"                          # log 即時輸出,不再看起來像卡住
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}      # 美股指數官方源(fetch_macro)
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}    # 可選;未設定則走免token額度
          US_YAHOO_FALLBACK: "1"                         # r705:美股日K最後備援(僅美股;設 0 可關,台股維持零 Yahoo)
        run: python update_data.py

      # 以下兩步是保底:盤中主力已交給 intraday-quotes 的自迴圈,這裡只在重班順手再跑一次
      - name: 盤中報價與分時快照(spark)
        env:
          PYTHONUNBUFFERED: "1"
        run: python update_quotes.py || echo "報價快照失敗,不影響主資料"

      - name: 🤖 AI Pick 週選模型與戰績結算(r702)
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}     # r771:入選/出場理由(純敘述,沒金鑰就跳過)
        run: python aipick.py || echo "AI Pick 失敗,不影響主資料"

      - name: 提交結果
        run: |
          git config user.name  "bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data.json k c
          if [ -f tdcc.json ]; then git add tdcc.json; fi
          if [ -f etf_hold.json ]; then git add etf_hold.json; fi
          git add e/ 2>/dev/null || true                # r755:ETF 每日持股快照歷史(兩支 workflow 都會寫,漏加就丟失)
          if [ -f spark.json ]; then git add spark.json; fi
          if [ -f aipick.json ]; then git add aipick.json; fi
          if git diff --cached --quiet; then
            echo "沒有變更,略過提交"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          # 與其他排程可能撞車:-X theirs = 以本次新產資料為準;失敗自動重試 3 次
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            echo "推送撞車,10 秒後重試($i/3)…"
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "::error::推送重試 3 次仍失敗"
          exit 1
