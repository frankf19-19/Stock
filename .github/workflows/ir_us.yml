name: 美股財報新聞稿AI整理
on:
  workflow_dispatch:
    inputs:
      months_back:
        description: "回補幾個月(預設 3)"
        default: ""
      max:
        description: "本班最多幾份(預設 30)"
        default: ""
      only:
        description: "只跑這一檔代號"
        default: ""
  schedule:
    # 台北 07:35(美股盤後 8-K 多在收盤後 1~2 小時申報)、10:35(補晚申報)
    - cron: "35 23 * * 1-5"
    - cron: "35 2 * * 2-6"
permissions:
  contents: write
concurrency:
  group: ir_us
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 整理
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          MONTHS_BACK: ${{ github.event.inputs.months_back }}
          MAX_PER_RUN: ${{ github.event.inputs.max }}
          ONLY: ${{ github.event.inputs.only }}
          PYTHONUNBUFFERED: "1"
        run: |
          python listen_us.py 2>&1 | tee /tmp/lu.txt
          grep -E "✅|⏸|例外|找不到|非財報" /tmp/lu.txt | head -12 | sed 's/^/::notice::/' || true
      - name: 提交
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add ir_us_index.json ir_us/ 2>/dev/null || true
          git commit -m "美股財報AI整理 [CI Skip]" || echo "無變更"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i*6))
          done
