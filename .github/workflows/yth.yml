name: 財經皓角最新集自動整理
# r1108:游庭皓的財經皓角「早晨財經速解讀」——每個交易日 08:30 直播,直播結束後 podcast 上架;
#       跟股癌同一套:同集已整理直接跳過(零成本),09:25 / 10:25 / 12:25 三個檢查點,週末不跑
on:
  workflow_dispatch:
    inputs:
      force:
        description: "最新集已整理也重聽一次(1=是)"
        required: false
        default: "0"
  schedule:
    - cron: "25 1,2,4,6,9 * * 1-5"  # 台北 09:25、10:25、12:25、14:25、17:25(週一~五;GitHub 常整班丟掉,另有 cron_guard 由股癌班補啟動)
permissions:
  contents: write
concurrency:
  group: yth
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests yt-dlp
      - name: 聆聽整理
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          FORCE: ${{ github.event.inputs.force }}
          PYTHONUNBUFFERED: "1"
        run: |
          python listen_show.py yth 2>&1 | tee /tmp/yth_log.txt || true
          grep -E "最新集|路線|Gemini|音檔|完成|✗|⚠|重試|歸檔|模型|頻道 RSS|NO_AUDIO|對不上|開始聆聽" /tmp/yth_log.txt | tail -20 | sed 's/^/::notice::/' || true
          grep -q "^完成" /tmp/yth_log.txt || grep -q "已整理過" /tmp/yth_log.txt || echo "::warning::本班沒有產出(看上面 notice)"
      - name: YouTube 影片對照表(yt-dlp 扁平列表,不下載)
        run: timeout 300 python fetch_ytmap.py yth || echo "::warning::YouTube 對照表失敗"
      - name: 推薦好書(RSS 描述 + AI 整理,永久累積)
        run: python fetch_books.py yth || echo "::warning::好書清單失敗"
      - name: 提交結果
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add yth.json 2>/dev/null || true
          git add yth_hist/ 2>/dev/null || true
          git add yth_books.json yth_yt.json yth_yt_lite.json 2>/dev/null || true
          git commit -m "財經皓角重點更新 [CI Skip]" || echo "無變更"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs origin main -q && git push -q && exit 0; sleep 8; done
