name: ETF 持股更新(主動式)
on:
  schedule:
    - cron: '35 9 * * 1-5'    # 台北 17:35 每交易日|MoneyDJ 17:30 前後公布當日申報(r777)
    - cron: '5 11 * * 1-5'    # 台北 19:05 補一班|17:35 那班若還是前一日資料,這班補上
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: etf-hold
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - run: python fetch_etf.py
      - name: 主動式 ETF 選股能力評估(事件研究)
        run: python etf_edge.py || echo "etf_edge 失敗,不影響持股更新"
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add etf_hold.json e/ etf_rev.json || true
          if [ -f etf_edge.json ]; then git add etf_edge.json; fi                # r748:e/ 是每日持股快照歷史,漏加就永遠不會進版控
          git diff --cached --quiet || git commit -m "ETF 持股更新 [CI Skip]"
          git push || true
