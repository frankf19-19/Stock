name: 分數歷史一次性回補(r909)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kdata
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 回補
        run: python backfill_scores.py
      - name: 提交
        run: |
          git config user.name "kyansuo-bot"; git config user.email "bot@users.noreply.github.com"
          git add score_hist/
          git commit -m "score_hist: 回補網站誕生至今每日分數" -q || exit 0
          for i in 1 2 3; do git pull --rebase --autostash -X theirs origin main -q && git push -q && exit 0; sleep 5; done
