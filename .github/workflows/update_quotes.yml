# 放到 repo 的 .github/workflows/update_quotes.yml
# rev: 2026-08-06 r525 架構重造——排程只當「點火器」,掃價改為 job 內自迴圈
#      舊架構賭「每5分鐘的獨立班次都活著」,GitHub 靜默停用/塞車就整天斷針(8/6 spark 只剩 1 點的事故根因)。
#      新架構:點火一班,班內自己每5分鐘掃一輪+逐輪提交,掃到 13:45 為止;
#      新班啟動自動砍舊班(concurrency)=卡死自癒;一天只要任一班點著,盤中快照就連續。
# rev: 2026-08-31 r740 班次分工
#      事故:8/31(一)整個早盤 intraday-quotes 與 update_data 都沒被 GitHub 觸發(低頻的 workflow 同日全部正常),
#            高頻排程被丟棄是 GitHub 已知行為,對策只能是「點火點更多 + 單班活更久」。
#      1) 點火由每30分改為每15分——丟掉三班還有一班會點著,而且新班砍舊班本來就是無縫交棒。
#      2) 單班壽命由 45 分拉到 110 分——萬一整個早上只點著一班,它自己也能撐完早盤。
#      3) aipick.py(實測 <1 秒)併進迴圈:盤中每 5 分鐘結算一次 AI Pick,換股輪動才有辦法即時記錄。
name: intraday-quotes
on:
  schedule:
    - cron: "8,23,38,53 0-5 * * 1-5"   # 台北 08:08 起每15分點火(班內迴圈才是真正的每5分鐘)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: quotes
  cancel-in-progress: true        # 新班砍舊班:卡死的迴圈被下一班自動接手
jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # r741:單班要能從 08:08 撐到 13:45(≈5h37m),GitHub 單 job 上限 6 小時,350 分留安全邊際
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests numpy      # r740:aipick.py 的學習模型用 numpy;沒裝的話 fit_model 會靜默回傳 None,把 learn 降級成純規則版
      - name: 盤中自迴圈掃價 + AI Pick 結算(每5分鐘一輪,逐輪提交)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}           # r775:重要訊息推 Telegram(沒設就跳過)
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}       # 選配:LINE Messaging API(每月 200 則免費)
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          # r741 事故:8/31(一)整天「零班」被觸發——早盤 09:00~10:50 與尾盤 12:35~13:30 快照全空,
          #      只有手動點的那班撐住中間 1h45m(單班 110 分鐘一到就收工,沒有下一班接手)。
          #      調班距/調壽命都救不了「一次都沒點著」;正解是讓任何一班都能獨自撐完全場:
          #      END 改為「今日 13:45 的絕對時間」,單班從早上點著就一路掃到收盤,一天只要成功點火一次即可。
          END=$(TZ=Asia/Taipei date -d "today 13:45" +%s 2>/dev/null || echo 0)
          [ "$END" = "0" ] && END=$(( $(date +%s) + 300*60 ))   # date -d 失敗時的保險:單班 300 分鐘
          echo "本班預計掃到 $(TZ=Asia/Taipei date -d @$END '+%H:%M') 收工"
          while : ; do
            HM=$(TZ=Asia/Taipei date +%H%M); HM=$((10#$HM))
            [ $HM -gt 1345 ] && { echo "已過 13:45,本班收工"; break; }
            [ $(date +%s) -ge $END ] && { echo "已到 13:45 收盤,本班完成整場任務"; break; }
            if [ $HM -ge 855 ]; then
              git pull --rebase origin main || true      # 先同步,拿到別班/主更新最新的 spark 續寫
              python update_quotes.py || echo "本輪掃價失敗,5分鐘後再試"
              AIPICK_LIGHT=1 timeout 240 python aipick.py || echo "AI Pick 本輪略過(逾時或失敗),不影響報價"   # r740:輕量班=只結算與換股輪動(選股/重訓留給 update_data 重班);實測 <1 秒,240 秒上限保護 5 分鐘輪迴
              timeout 60 python notify.py || echo "推播本輪略過"                                              # r775:成交/出場/換股/到價 → Telegram(去重、每日上限)
              git add data.json 2>/dev/null || true
              git add notify_state.json 2>/dev/null || true
              [ -f spark.json ] && git add spark.json
              git add aipick.json 2>/dev/null || true          # 用 || true 而非 [ -f ] &&:GitHub 的 run 預設 bash -e,AND-list 回傳 1 會直接中斷整步
              if ! git diff --cached --quiet; then
                git commit -m "quotes: $(TZ=Asia/Taipei date +%H:%M)"
                if ! { git pull --rebase origin main && git push; }; then
                  git rebase --abort 2>/dev/null || true
                  git reset --hard origin/main            # 撞車禮讓:丟本輪,5分鐘後重掃(spark會重抓續寫)
                  echo "推送撞車,本輪禮讓"
                fi
              else
                echo "沒有變更,略過提交"
              fi
            else
              echo "$HM 未到 08:55,待命中"
            fi
            sleep 300
          done
