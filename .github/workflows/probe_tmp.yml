name: probe_tmp
on: workflow_dispatch
permissions: {contents: read}
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          O="Origin: https://frankf19-19.github.io"
          UA="User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          t(){ curl -sS -m 20 -D /tmp/h -o /tmp/b -H "$O" -H "$UA" "$2" 2>/tmp/e; m="$1 | $(head -1 /tmp/h | tr -d '\r') | $(grep -i 'access-control-allow-origin' /tmp/h | tr -d '\r') | $(cat /tmp/e) | $(head -c 1800 /tmp/b | tr -d '\r\n')"; echo "::notice title=$1::${m//%/%25}"; }
          t Q1 "https://quote.cnbc.com/quote-html-webservice/quote.htm?symbols=NVDA%7CARM%7CSIMO%7CSKYD%7CTSM&partnerId=2&requestMethod=quick&exthrs=1&noform=1&fund=1&output=json"
          t Q2 "https://quote.cnbc.com/quote-html-webservice/restQuote/symbolType/symbol?symbols=NVDA%7CARM&requestMethod=itv&noform=1&partnerId=2&fund=1&exthrs=1&output=json&events=1"
