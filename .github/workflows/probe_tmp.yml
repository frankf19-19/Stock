name: probe_tmp
on: workflow_dispatch
permissions: {contents: read}
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: pip -q install requests
      - run: |
          timeout 300 python fetch_bias.py > /tmp/log 2>&1 || true
          echo "::notice title=LOG::$(grep -v '^$' /tmp/log | tr '\n' ' ' | cut -c1-1500)"
          echo "::notice title=TWOII::$(python3 -c "
          import json;J=json.load(open('bias.json'))
          for x in J['idx']:
            m=x['ma']['20']; print(x['name'],x['as_of'],x['last'],x['zone'],'bias',m['bias'],'pct',m['pct'],'weeks',x['weeks'],'q',len(m.get('q') or []),'c_out',m.get('c_out'),'|',end=' ')
          " | cut -c1-1200)"
