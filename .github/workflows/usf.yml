# 放到 repo 的 .github/workflows/usf.yml
# r530:美股基本面(SEC EDGAR 官方 XBRL)每日一更 —— 台北早上美股收盤後
name: us-fundamentals
on:
  schedule:
    - cron: "40 22 * * 0-4"    # UTC 22:40 = 台北 06:40(美股收盤後、財報多已入 EDGAR)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: usf
  cancel-in-progress: false
jobs:
  usf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: 抓 SEC EDGAR frames 組 usf.json
        env: { PYTHONUNBUFFERED: "1" }
        run: python fetch_usf.py
      - name: 提交
        run: |
          git config user.name "bot"
          git config user.email "actions@users.noreply.github.com"
          git add usf.json
          [ -f us_cik.json ] && git add us_cik.json || true
          if ! git diff --cached --quiet; then
            git commit -m "usf: $(TZ=Asia/Taipei date +%m/%d)"
            { git pull --rebase --autostash origin main && git push; } || { git rebase --abort 2>/dev/null||true; git reset --hard origin/main; echo "撞車禮讓,明日再試"; }
          fi
