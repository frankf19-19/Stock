name: probe-mis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - env:
          PROXY_JSON: proxy.json
        run: |
          python - <<'PY'
          import json,time,requests,urllib.parse,datetime as dt
          import update_quotes as U
          ids=["tse_2330.tw","tse_1109.tw","tse_2886.tw","otc_6213.tw","tse_2412.tw","tse_0050.tw"]
          q=("https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch="+'|'.join(ids)+f"&json=1&delay=0&_={int(time.time()*1000)}")
          for nm,url in [("direct",q)]+([("worker",f"{U.PROXY}/?url={urllib.parse.quote(q,safe='')}")] if U.PROXY else []):
              try:
                  r=requests.get(url,headers=U.UA,timeout=20);j=r.json();arr=j.get("msgArray") or []
                  print(f"::notice::{nm} status {r.status_code} n={len(arr)} rtcode={j.get('rtcode')} rtmessage={j.get('rtmessage')}")
                  for m in arr: print("::notice::"+nm+" "+json.dumps({k:m.get(k) for k in ('c','d','t','tlong','z','pz','y','o','h','l','v','b','a','ot')},ensure_ascii=False))
              except Exception as e: print(f"::notice::{nm} EXC {type(e).__name__} {str(e)[:120]}")
          print("::notice::now_tp "+dt.datetime.now(U.TP).strftime("%Y%m%d %H:%M"))
          # full scan timing: how many batches return data
          tw=[(s["id"],s.get("ex","tse")) for s in json.load(open("data.json"))["stocks"] if s.get("market")=="TW"]
          ok=0;n=0;t0=time.time();zs=0
          for i in range(0,len(tw),U.BATCH):
              ch=tw[i:i+U.BATCH];arr=U.mis_get([f"{'otc' if ex=='otc' else 'tse'}_{sid}.tw" for sid,ex in ch]);n+=1
              if arr: ok+=1; zs+=sum(1 for m in arr if (U.px(m,'z') or U.px(m,'pz')))
              if i>=U.BATCH*8: break
              time.sleep(0.4)
          print(f"::notice::batches tried {n} ok {ok} with_price {zs} sec {time.time()-t0:.0f}")
          PY
