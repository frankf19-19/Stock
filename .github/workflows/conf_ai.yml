name: 法說會AI讀簡報分析
on:
  workflow_dispatch:
    inputs:
      months_back:
        description: "回補幾個月(預設 2;首次回補可填 12)"
        default: ""
      max:
        description: "本班最多幾場(預設 60)"
        default: ""
      only:
        description: "只跑這一檔代號"
        default: ""
  schedule:
    # 台北 12:40 / 18:40 / 21:40 / 02:40(公司通常盤後上傳簡報;同場次不重跑,零成本)
    - cron: "40 4 * * 1-5"
    - cron: "40 10 * * 1-5"
    - cron: "40 13 * * 1-5"
    - cron: "40 18 * * 1-6"
    - cron: "40 0 * * 0,6"
permissions:
  contents: write
concurrency:
  group: conf_ai
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安裝套件
        run: pip install requests
      - name: 讀簡報分析
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          MONTHS_BACK: ${{ github.event.inputs.months_back }}
          MAX_PER_RUN: ${{ github.event.inputs.max }}
          ONLY: ${{ github.event.inputs.only }}
          PYTHONUNBUFFERED: "1"
        run: |
          python listen_conf.py 2>&1 | tee /tmp/lc.txt
          grep -E "✅|⏸|\[warn\]|例外|不可讀|下載不到" /tmp/lc.txt | head -12 | sed 's/^/::notice::/' || true
      - name: 提交結果
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add conf_ai.json ir_index.json ir/ 2>/dev/null || true
          git commit -m "法說AI分析更新 [CI Skip]" || echo "無變更"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i*6))
          done
          echo "推送撞車,下一班自動再試"
