name: 國際行情更新(yext)

on:
  schedule:
    # 密集班次對抗 GitHub 排程塞車;腳本輕量(14檔、約40秒),公開 repo 分鐘數免費
    - cron: '*/20 1-5 * * 1-5'     # 台北 09:00~13:40|台股時段(加權/櫃買分線)
    - cron: '*/20 13-21 * * 1-5'   # 台北 21:00~05:40|美股時段(美指/期貨/DXY)
    - cron: '10 7 * * 1-5'         # 台北 15:10|台股收盤快照
    - cron: '40 22 * * 1-5'        # 台北 06:40|美股收盤快照
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yext-update
  cancel-in-progress: false

jobs:
  yext:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip -q install numpy                      # r1091:美股 AI Pick 盤中輕量班(aipick.py 模型用到 numpy;其餘純標準庫)
      # r1091:美股盤中(美東 09:30~16:05)順便跑美股 AI Pick 輕量班——用 CNBC 即時報價記錄「到買價/到目標/觸停損」的時間,
      #        不用等隔天早上日 K 才知道;正式成交/出場仍以收盤後官方日 K 判定。
      #        自己一筆提交、撞車就以 origin/main 重跑(不用 -X theirs,免得蓋掉傍晚重班剛產的新名單)。
      - name: 美股 AI Pick 盤中
        run: |
          git config user.name "bot"
          git config user.email "actions@users.noreply.github.com"
          H=$(TZ=America/New_York date +%H%M); H=$((10#$H))
          if [ $H -ge 930 ] && [ $H -le 1605 ] && python market_day.py us >/dev/null; then
            for i in 1 2 3; do
              git fetch -q origin main && git reset -q --hard origin/main
              AIPICK_MKT=US AIPICK_LIGHT=1 timeout 240 python aipick.py || { echo "美股 AI Pick 盤中略過"; break; }
              git add aipick_us.json
              if git diff --cached --quiet; then echo "美股 AI Pick 無變更"; break; fi
              git commit -qm "aip-us: 盤中 $(TZ=America/New_York date +%H:%M) ET"
              git push -q origin HEAD:main && { echo "美股 AI Pick 盤中已提交"; break; }
              echo "推送撞車,重跑($i/3)"; sleep 5
            done
            git fetch -q origin main && git reset -q --hard origin/main
          else
            echo "美東 $H 非正常盤,略過"
          fi
      - run: python fetch_yext.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: 提交
        run: |
          git config user.name "bot"
          git config user.email "actions@users.noreply.github.com"
          git add yext.json
          if git diff --cached --quiet; then echo "無變更"; exit 0; fi
          git commit -m "yext: $(TZ=Asia/Taipei date +'%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true; sleep 8
          done
          exit 1
