name: 探針:法說會來源(暫時)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pypdf
      - run: |
          python probe_ir.py > /tmp/p.txt 2>&1 || true
          grep "^::notice::" /tmp/p.txt
          grep -v "^::notice::" /tmp/p.txt | tail -c 1500 | tr '\n' ' ' | sed 's/^/::warning::LOG /'
