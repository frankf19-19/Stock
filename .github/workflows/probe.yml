name: 探針:法說會來源(暫時)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pypdf
      - run: |
          python - <<'PY'
          import os,requests,json,re,io,urllib.parse
          UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64)","Accept":"*/*"}
          def N(s): print("::notice::"+str(s)[:900])
          PX=json.load(open("proxy.json"))["url"].rstrip("/")
          def px(u): return PX+"/?url="+urllib.parse.quote(u,safe="")
          # 1 swagger 關鍵字
          for u in ("https://openapi.twse.com.tw/v1/swagger.json","https://www.tpex.org.tw/openapi/v1/swagger.json"):
              try:
                  j=requests.get(u,headers=UA,timeout=40).json()
                  hits=[(p,(v.get(m) or {}).get("summary","")) for p,v in j.get("paths",{}).items() for m in v if re.search("說明會|會議|行事曆|簡報|ap38|ap04|ap0[1-9]",p+(v.get(m) or {}).get("summary",""))]
                  N(f"swagger {u.split('/')[2]} paths={len(j.get('paths',{}))} hits={hits[:30]}")
              except Exception as e: N(f"swagger {u} ERR {e}")
          # 2 MOPS 舊版 mopsov / 新版頁面
          for u,data in (("https://mopsov.twse.com.tw/mops/web/ajax_t100sb02_1",{"encodeURIComponent":"1","step":"1","firstin":"1","off":"1","TYPEK":"sii","year":"115","month":"10"}),
                         ("https://mops.twse.com.tw/mops/web/ajax_t100sb02_1",{"encodeURIComponent":"1","step":"1","firstin":"1","off":"1","TYPEK":"sii","year":"115","month":"10"})):
              for name,mk in (("direct",lambda u:u),("worker",px)):
                  try:
                      r=requests.post(mk(u),headers=UA,timeout=60,data=data); t=r.text
                      N(f"{u.split('/')[2]} {name} {r.status_code} len={len(t)} 法說={t.count('法說')} tr={t.count('<tr')} head={re.sub(r'\s+',' ',t[:300])}")
                      links=re.findall(r'(FileDownLoad[^"\']+|/nas/[^"\']+|https?://[^"\']+\.(?:pdf|PDF))',t)[:3]
                      if links: N(f"links {links}")
                      m=re.search(r'<tr[^>]*>(?:(?!</tr>).){200,2000}</tr>',t,re.S)
                      if m: N("row: "+re.sub(r'\s+',' ',m.group(0))[:700])
                  except Exception as e: N(f"{u} {name} ERR {str(e)[:120]}")
          # 2b 新版 MOPS 首頁 看它要什麼
          try:
              r=requests.get("https://mops.twse.com.tw/mops/web/t100sb02_1",headers=UA,timeout=60); t=r.text
              N(f"mops page {r.status_code} len={len(t)} cookies={dict(r.cookies)} head={re.sub(r'\s+',' ',t[:400])}")
          except Exception as e: N(f"mops page ERR {e}")
          # 2c 重大訊息 openapi(法說會公告會在這裡)
          try:
              j=requests.get("https://openapi.twse.com.tw/v1/opendata/t187ap04_L",headers=UA,timeout=40).json()
              hs=[x for x in j if '法人說明會' in json.dumps(x,ensure_ascii=False) or '法說' in json.dumps(x,ensure_ascii=False)]
              N(f"t187ap04_L n={len(j)} 法說相關={len(hs)} keys={list(j[0].keys()) if j else ''} sample={str(hs[:1])[:700]}")
          except Exception as e: N(f"t187ap04_L ERR {e}")
          # 4 FinMind 三表
          tok=os.environ.get("FINMIND_TOKEN","")
          for ds in ("TaiwanStockBalanceSheet","TaiwanStockCashFlowsStatement","TaiwanStockFinancialStatements"):
              try:
                  j=requests.get("https://api.finmindtrade.com/api/v4/data",params={"dataset":ds,"data_id":"2330","start_date":"2026-06-30","end_date":"2026-06-30","token":tok},timeout=60).json()
                  rows=j.get("data") or []; N(f"FM {ds} n={len(rows)} types={[r['type'] for r in rows][:40]}")
              except Exception as e: N(f"FM {ds} ERR {str(e)[:100]}")
          PY
