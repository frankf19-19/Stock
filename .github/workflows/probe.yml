name: 🔎 資料源探測(一次性)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: python tools/probe.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -f probe_out/; git commit -m "probe [CI Skip]" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
