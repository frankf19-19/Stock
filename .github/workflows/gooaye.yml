name: 股癌最新集自動整理
on:
  workflow_dispatch:
  schedule:
    - cron: "15 */2 * * *"    # r492:每 2 小時(同集已整理直接跳過零成本;上片日延遲減半)
permissions:
  contents: write
  actions: write            # r1078/r1081:順便當「排程保險」——GitHub 排程常漏跑,該有的資料沒出就由這裡補點火(cron_guard.py)
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: ⏰ 排程保險(早報、融資融券、網站管理員:時間到了還沒出 → 補啟動)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in $(python3 cron_guard.py); do
            gh workflow run "$wf" -R "$GITHUB_REPOSITORY" --ref main && echo "已補啟動 $wf"
          done
      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安裝套件
        run: pip install requests
      - name: 聆聽整理
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python listen_gooaye.py
      - name: 提交結果
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add gooaye.json gooaye_hist/ 2>/dev/null || true
          git commit -m "股癌重點更新 [CI Skip]" || echo "無變更"
          git pull --rebase origin main || true
          git push || true
